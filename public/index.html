<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acme</title>
<style>
  /* Acme's own product, as its customers' people see it. Keycard stays behind it. */
  :root { --bg: #fafaf9; --panel: #fff; --text: #1c1917; --muted: #78716c; --line: #e7e5e4; --brand: #0f766e; --brand-bg: #f0fdfa; --red: #b91c1c; --red-bg: #fef2f2; --green: #047857; --green-bg: #ecfdf5; --code: #f5f5f4; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  header { background: var(--panel); border-bottom: 1px solid var(--line); padding: 10px 24px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .logo { font-weight: 700; font-size: 16px; color: var(--brand); }
  header .grow { flex: 1; }
  a { color: var(--brand); }
  main { max-width: 960px; margin: 24px auto; padding: 0 16px; display: grid; gap: 16px; }
  h1 { font-size: 22px; margin: 0; }
  h2 { font-size: 15px; margin: 0; }
  .sub, .muted { color: var(--muted); }
  .sub { margin: 2px 0 0; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 10px; }
  .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
  .cust .who { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .links { display: flex; gap: 12px; flex-wrap: wrap; font-size: 13px; }
  .pill { display: inline-block; font-size: 12px; font-weight: 600; border-radius: 999px; padding: 1px 9px; }
  .pill.on { color: var(--green); background: var(--green-bg); }
  .pill.off { color: var(--red); background: var(--red-bg); }
  button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--line); background: #fff; padding: 6px 12px; }
  button.primary { background: var(--brand); color: #fff; border-color: var(--brand); font-weight: 600; }
  button:disabled { opacity: .5; cursor: default; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; flex-wrap: wrap; }
  .seg button { border: 0; border-radius: 0; color: var(--muted); }
  .seg button[aria-pressed="true"] { background: var(--brand-bg); color: var(--brand); font-weight: 600; }
  .field { display: grid; gap: 6px; }
  .field > span { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chips button { font-size: 13px; padding: 4px 10px; border-radius: 999px; }
  textarea { font: inherit; width: 100%; min-height: 64px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; resize: vertical; }
  .reply { background: var(--brand-bg); border-radius: 8px; padding: 10px 12px; white-space: pre-wrap; }
  .line { display: grid; grid-template-columns: 22px 1fr; gap: 8px; padding: 8px 0; border-top: 1px solid var(--line); }
  .line:first-child { border-top: 0; }
  .line .mark { font-weight: 700; }
  .line.ok .mark { color: var(--green); }
  .line.bad .mark { color: var(--red); }
  .line .detail { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
  .line .policy { font-size: 13px; }
  .boot { font: 12.5px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--code); border-radius: 8px; padding: 10px; white-space: pre-wrap; max-height: 260px; overflow: auto; }
  .err { color: var(--red); }
  ol { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
  @media (max-width: 600px) { header { padding: 10px 16px; } }
</style>
</head>
<body>
<header>
  <span class="logo">Acme</span>
  <span class="muted">AI agents for your team</span>
  <span class="grow"></span>
  <button type="button" id="reset" title="Default tools for every agent, every agent switched on, for both customers">Put everything back</button>
</header>
<main id="main"><p class="muted">Loading…</p></main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let S = null, as = new URLSearchParams(location.search).get('as'), agentKey = 'marketing', busy = false, result = null;

async function load() {
  S = await (await fetch('/api/state')).json();
  if (!as || !S.customers.some(c => c.key === as)) as = (S.customers.find(c => c.signedIn) ?? S.customers[0]).key;
  render();
  if (!S.ready && !S.error) setTimeout(load, 1500);
}

function render() {
  if (!S.ready) {
    $('main').innerHTML = `<div class="card"><h2>${S.error ? 'Couldn’t start' : 'Setting up your Keycard zones…'}</h2>
      ${S.error ? `<p class="err">${esc(S.error)}</p><p class="muted">Fix it, then run <code>npm start</code> again.</p>` : ''}
      <div class="boot">${esc(S.log.join('\n'))}</div></div>`;
    return;
  }
  const me = S.customers.find(c => c.key === as), other = S.customers.find(c => c.key !== as);
  const ag = S.agents.find(a => a.key === agentKey);
  $('main').innerHTML = `
    <div><h1>Acme for your company</h1>
      <p class="sub">Two Acme customers, each with its own Keycard zone. Sign in as each customer’s person, then ask Acme’s agents for things.</p></div>
    <div class="row">${S.customers.map(c => `<div class="card cust">
      <div class="who"><h2>${esc(c.name)}</h2>${c.signedIn ? '<span class="pill on">Signed in</span>' : '<span class="pill off">Signed out</span>'}</div>
      <div>${esc(c.person.name)} <span class="muted">· ${esc(c.person.title)}</span></div>
      <div>${c.signedIn ? `<button type="button" data-signout="${esc(c.key)}">Sign out</button>` : `<a href="/login/${esc(c.key)}"><button type="button" class="primary">Sign in as ${esc(c.person.name.split(' ')[0])}</button></a>`}</div>
      <div class="links"><a href="/customers/${esc(c.key)}/settings">${esc(c.name)}’s settings in Acme</a>
        ${c.console ? `<a href="${esc(c.console.audit)}" target="_blank" rel="noopener">Keycard audit log ↗</a><a href="${esc(c.console.policies)}" target="_blank" rel="noopener">Policies ↗</a>` : ''}</div>
      ${c.off.length ? `<div class="muted">Switched off at ${esc(c.name)}: ${c.off.map(k => esc(S.agents.find(a => a.key === k)?.name)).join(', ')}</div>` : ''}
    </div>`).join('')}</div>
    <div class="card">
      <label class="field"><span>Acting as</span><div class="seg">${S.customers.map(c => `<button type="button" data-as="${esc(c.key)}" aria-pressed="${c.key === as}">${esc(c.person.name)} · ${esc(c.name)}</button>`).join('')}</div></label>
      <label class="field"><span>Agent</span><div class="seg">${S.agents.map(a => `<button type="button" data-agent="${esc(a.key)}" aria-pressed="${a.key === agentKey}">${esc(a.name)}</button>`).join('')}</div></label>
      <div class="muted">${esc(ag.blurb)}</div>
      <div class="field"><span>Try</span><div class="chips">${ag.prompts.map((p, i) => `<button type="button" data-prompt="${i}">${esc(p.label.replace('{other}', other.name))}</button>`).join('')}</div></div>
      <textarea id="prompt" aria-label="What to ask the agent" placeholder="Ask the ${esc(ag.name)}…"></textarea>
      <div><button type="button" class="primary" id="ask" ${busy || !me.signedIn ? 'disabled' : ''}>${busy ? 'Working…' : `Ask as ${esc(me.person.name.split(' ')[0])}`}</button>
        ${me.signedIn ? '' : `<span class="muted">Sign in as ${esc(me.person.name.split(' ')[0])} first.</span>`}</div>
    </div>
    ${result ? resultCard() : ''}
    <details class="card"><summary><b>Walkthrough</b></summary><ol>
      <li>As Gina, ask the Support Agent for <i>our open tickets</i>: allowed, in Globex’s zone. As Ivan, the same: allowed, in Initech’s.</li>
      <li>As Gina, ask it to <i>compare with Initech</i>. The agent has a multi-tenant bug and tries Initech’s tickets with Gina’s token; Initech’s zone refuses.</li>
      <li>As Gina, ask the Marketing Agent to <i>upload the brief</i> (allowed), then to <i>move the due date</i> (refused: Globex hasn’t allowed “Update projects”).</li>
      <li>As Gina, ask the Support Agent to <i>upload the brief</i>: refused. Different agent, different rules.</li>
      <li>In Globex’s settings, allow “Update projects” for the Marketing Agent. Gina’s next try works; Ivan’s is still refused.</li>
      <li>In Globex’s settings, switch the Support Agent off. Gina is refused; Ivan at Initech isn’t.</li>
      <li>Open each zone’s audit log and policies in the Keycard Console. Then click <b>Put everything back</b>.</li>
    </ol></details>`;
}

function resultCard() {
  const r = result;
  return `<div class="card"><h2>${esc(r.title)}</h2>
    ${r.error ? `<p class="err">${esc(r.error)}</p>` : `<div class="reply">${esc(r.reply || '(no reply)')}</div>`}
    ${r.lines?.length ? `<h2>What Keycard decided</h2><div>${r.lines.map(l => `<div class="line ${l.ok ? 'ok' : 'bad'}"><span class="mark">${l.ok ? '✓' : '✕'}</span><div>
      <div>${esc(l.label)}</div>
      ${l.policy ? `<div class="policy">Refused by <b>${esc(l.policy)}</b></div>` : ''}
      <div class="detail">${esc(l.detail)}</div>
      ${l.link ? `<a href="${esc(l.link)}" target="_blank" rel="noopener" class="detail">In Keycard’s audit log ↗</a>` : ''}</div></div>`).join('')}</div>` : ''}
  </div>`;
}

document.addEventListener('click', async e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.as) { as = t.dataset.as; history.replaceState(null, '', `/?as=${as}`); return render(); }
  if (t.dataset.agent) { agentKey = t.dataset.agent; return render(); }
  if (t.dataset.prompt) {
    const other = S.customers.find(c => c.key !== as);
    $('prompt').value = S.agents.find(a => a.key === agentKey).prompts[t.dataset.prompt].text.replace('{other}', other.name);
    return $('prompt').focus();
  }
  if (t.dataset.signout) { await fetch(`/api/signout/${t.dataset.signout}`, { method: 'POST' }); return load(); }
  if (t.id === 'reset') {
    t.disabled = true; t.textContent = 'Putting it back…';
    const r = await (await fetch('/api/reset', { method: 'POST' })).json().catch(err => ({ error: err.message }));
    t.disabled = false; t.textContent = 'Put everything back';
    if (r.error) alert(r.error);
    return load();
  }
  if (t.id === 'ask') {
    const prompt = $('prompt').value.trim(); if (!prompt) return $('prompt').focus();
    const me = S.customers.find(c => c.key === as), ag = S.agents.find(a => a.key === agentKey);
    busy = true; render(); $('prompt').value = prompt;
    const r = await (await fetch('/api/ask', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ customer: as, agent: agentKey, prompt }) }))
      .json().catch(err => ({ error: err.message }));
    result = { title: `${me.person.name} → ${ag.name}: “${prompt}”`, ...r };
    busy = false;
    if (r.signIn) await load(); else render();
    $('prompt').value = prompt;
  }
});
load();
</script>
</body>
</html>
